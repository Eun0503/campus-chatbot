<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학사 길잡이 (테스트)</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 24px; }
    .box { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-top: 16px; }
    button { padding: 8px 16px; font-size: 15px; cursor: pointer; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>학사 길잡이</h1>
  <p>2주차 환경 구성 테스트 페이지입니다. S3에 올린 이 화면이 CloudFront로 보이고, 아래 버튼을 누르면 API Gateway → Lambda를 호출합니다.</p>

  <div class="box">
    <button id="btn">API 호출 테스트</button>
    <pre id="out">아직 호출하지 않음</pre>
  </div>

  <script src="config.js"></script>
  <script>
    const btn = document.getElementById('btn');
    btn.addEventListener('click', async () => {
      const out = document.getElementById('out');
      out.textContent = '호출 중...';
      try {
        const res = await fetch(API_URL + '/hello');
        const data = await res.json();
        out.textContent = 'HTTP ' + res.status + '\n' + JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = '호출 실패: ' + e;
      }
    });
    // 주소 끝에 #test를 붙이면 열자마자 한 번 호출한다 (확인 화면 캡처용)
    if (location.hash === '#test') btn.click();
  </script>
</body>
</html>
